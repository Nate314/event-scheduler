<div class="row">
    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-4 col-xl-4">
        <app-about></app-about>
    </div>
    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-8 col-xl-8">
        <br />
        <br />
        <h2 class="text-center">{{ greeting }}, {{ username }}</h2>
        <br/>
        <app-event-create></app-event-create>
        <br/>
        <mat-tab-group mat-stretch-tabs selectedIndex="1">
            <mat-tab label="Past">
                <ng-container *ngTemplateOutlet="listTemplate;context:pastEvents"></ng-container>
            </mat-tab>
            <mat-tab label="Today">
                <ng-container *ngTemplateOutlet="listTemplate;context:todayEvents"></ng-container>
            </mat-tab>
            <mat-tab label="Future">
                <ng-container *ngTemplateOutlet="listTemplate;context:futureEvents"></ng-container>
            </mat-tab>
        </mat-tab-group>
        <br/>
        
        <ng-template #listTemplate let-events="events">
            <div class="mx-3">
                <br />
                <div *ngIf="!events || events.length === 0">
                    There are no events in the queue
                </div>
                <div *ngIf="events && events.length !== 0">
                    <ng-container *ngFor="let eventID of events">
                        <app-event-view
                            [eventID]="eventID">
                        </app-event-view>
                        <br />
                    </ng-container>
                </div>
            </div>
        </ng-template>
    </div>
</div>
