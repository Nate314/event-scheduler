<ng-container *ngIf="!isFormVisible && !isEditMode">
    <div class="text-center">
        <button mat-raised-button color="primary" style="width:150px;"
            (click)="isFormVisible = true">
            <mat-icon>add</mat-icon>
            <span>&nbsp;Add Event</span>
        </button>
    </div>
    <br />
</ng-container>
<ng-container *ngIf="isFormVisible || isEditMode">
    <mat-card class="mat-elevation-z6">
        <div class="row">
            <div class="col-xs-12 col-sm-12 col-md-6">
                <mat-form-field>
                    <mat-label>Title</mat-label>
                    <input matInput [formControl]="titleFormControl" placeholder="Event Title" />
                    <mat-error *ngIf="titleFormControl.hasError('required')">
                        Required
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="col-xs-12 col-sm-12 col-md-6">
                <mat-form-field>
                    <mat-label>Follow up Date</mat-label>
                    <input matInput [matDatepicker]="datePicker" [formControl]="dateFormControl">
                    <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
                    <mat-datepicker #datePicker></mat-datepicker>
                    <mat-error *ngIf="dateFormControl.hasError('required')">
                        Required
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <app-notes-create
            [isEditMode]="isEditMode"
            [eventID]="eventInformation.id"
            [savingEventID]="savingEventID"
            [isFormVisible]="isFormVisible"
            (doneSaving)="this.isFormVisible = false;">
        </app-notes-create>
        <br />
        <mat-card-actions>
            <div class="text-right">
                <button mat-button color="warn" (click)="isFormVisible = false">
                    <mat-icon>close</mat-icon>
                    <span>&nbsp;Close Event</span>
                </button>
                <button mat-button color="primary" (click)="btnSave()">
                    <mat-icon>save</mat-icon>
                    <span>&nbsp;Save Event</span>
                </button>
            </div>
        </mat-card-actions>
    </mat-card>
</ng-container>
