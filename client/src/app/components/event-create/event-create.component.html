<ng-container *ngIf="!isFormVisible && !isEditMode">
    <button mat-raised-button color="primary"
        (click)="isFormVisible = !isFormVisible">
        Add Event
    </button>
</ng-container>
<ng-container *ngIf="isFormVisible || isEditMode">
    <mat-card class="mat-elevation-z6">
        <button mat-button style="float: right; font-size: 2.5rem;"
            (click)="isFormVisible = !isFormVisible">
            &times;
        </button>
        <br />
        <div class="row">
            <div class="col-6">
                <mat-form-field>
                    <mat-label>Title</mat-label>
                    <input matInput [formControl]="titleFormControl" placeholder="Event Title" />
                    <mat-error *ngIf="titleFormControl.hasError('required')">
                        Required
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field>
                    <mat-label>Date</mat-label>
                    <input matInput [matDatepicker]="datePicker" [formControl]="dateFormControl">
                    <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
                    <mat-datepicker #datePicker></mat-datepicker>
                    <mat-error *ngIf="dateFormControl.hasError('required')">
                        Required
                    </mat-error>
                  </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <mat-form-field>
                    <mat-label>Description</mat-label>
                    <textarea matInput [formControl]="descriptionFormControl" placeholder="Event Description . . ."></textarea>
                    <mat-error *ngIf="descriptionFormControl.hasError('required')">
                        Required
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <br />
        <button mat-raised-button color="primary" (click)="btnAdd()">
            Save
        </button>
    </mat-card>
</ng-container>
