<h4>Notes</h4>
<mat-divider></mat-divider>
<ng-container *ngIf="notes && notes.length">
    <div *ngFor="let note of notes">
        <div class="my-2">
            <div class="date-label">{{note.date}}</div>
            <div [ngClass]="{'note-content': true, 'pinned-note': note.pinned}">{{note.description}}</div>
        </div>
        <mat-divider></mat-divider>
    </div>
</ng-container>
<ng-container *ngIf="!notes || !notes.length">
    <div class="my-2">
        No notes for this event
    </div>
</ng-container>
