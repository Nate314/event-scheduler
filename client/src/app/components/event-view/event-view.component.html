<mat-expansion-panel (afterExpand)="btnExpand()" class="mat-elevation-z6">
    <mat-expansion-panel-header>
        <mat-panel-title>
            <span>{{displayedTitle}}</span>
        </mat-panel-title>
        <mat-panel-description>
            <span>{{displayedDate}}</span>
            <mat-icon>info</mat-icon>
        </mat-panel-description>
    </mat-expansion-panel-header>
    <ng-container *ngIf="eventInformation && !isEditMode">
        <app-event-view-notes [eventID]="eventInformation.id">
        </app-event-view-notes>
        <button mat-button color="primary" style="float:right;"
            (click)="isEditMode = !isEditMode">
            <mat-icon>add</mat-icon> Note
        </button>
        <br />
        <br />
        <mat-action-row>
            <button mat-button color="primary" (click)="isEditMode = !isEditMode">
                <mat-icon>create</mat-icon>
                <span>&nbsp;Edit</span>
            </button>
            <button mat-button color="warn" (click)="btnDelete()">
                <mat-icon>delete</mat-icon>
                <span>&nbsp;Delete</span></button>
        </mat-action-row>
    </ng-container>
    <app-event-create *ngIf="isEditMode"
        [eventInformation]="eventInformation" [isEditMode]="true"
        (onClose)="isEditMode = !isEditMode">
    </app-event-create>
    <ng-container *ngIf="!eventInformation">
        <mat-spinner></mat-spinner>
    </ng-container>
</mat-expansion-panel>
