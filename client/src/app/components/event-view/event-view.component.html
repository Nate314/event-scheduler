<mat-expansion-panel (afterExpand)="btnExpand()" class="mat-elevation-z6">
    <mat-expansion-panel-header>
        <mat-panel-title>
            {{eventID.title}}
        </mat-panel-title>
        <mat-panel-description>
        </mat-panel-description>
    </mat-expansion-panel-header>
    <ng-container *ngIf="eventInformation && !isEditMode">
        <app-event-view-details [eventInformation]="eventInformation">
        </app-event-view-details>
        <mat-action-row>
            <button mat-button color="primary" (click)="isEditMode = !isEditMode">Edit</button>
            <button mat-button color="warn" (click)="btnDelete()">Delete</button>
        </mat-action-row>
    </ng-container>
    <app-event-create *ngIf="isEditMode"
        [eventInformation]="eventInformation" [isEditMode]="true"
        (onClose)="isEditMode = !isEditMode">
    </app-event-create>
    <ng-container *ngIf="!eventInformation">
        <mat-spinner></mat-spinner>
    </ng-container>
</mat-expansion-panel>
