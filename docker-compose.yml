services:

    client:
        build:
            context: .
            dockerfile: client/Dockerfile
        ports:
            - "${CLIENT_PORT:-8080}:8080"
        depends_on:
            - server
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL

    server:
        build:
            context: .
            dockerfile: server/Dockerfile
        # No host port: the client's nginx proxies /api to this service.
        # The server holds one MySQL connection and exits if it drops; come back with a fresh one.
        restart: unless-stopped
        environment:
            DB_HOST: mysql-db
            DB_PORT: 3306
            DB_NAME: EventScheduler
            DB_USER: ${DB_USER:-eventscheduler_app}
            DB_PASSWORD: ${DB_PASSWORD:-dev-only-app-password-change-me}
            JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
        depends_on:
            mysql-db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL

    mysql-db:
        image: mysql:8.4
        # The queries use lowercase table names (users) while db/ddl.sql creates Users.
        command: ["--lower-case-table-names=1"]
        volumes:
            - ./db:/docker-entrypoint-initdb.d:ro
            - mysql-data:/var/lib/mysql
        environment:
            MYSQL_ROOT_HOST: localhost
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-only-root-password-change-me}
            MYSQL_DATABASE: EventScheduler
            MYSQL_USER: ${DB_USER:-eventscheduler_app}
            MYSQL_PASSWORD: ${DB_PASSWORD:-dev-only-app-password-change-me}
        healthcheck:
            # TCP, not the socket: the entrypoint's first-start init server listens only on the socket,
            # so this passes once the real server is up. ping exits 0 even when access is denied.
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            interval: 5s
            timeout: 5s
            retries: 30
        security_opt:
            - no-new-privileges:true

volumes:
    mysql-data:
