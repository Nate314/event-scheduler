export default "<h4>Notes</h4>\r\n<mat-divider></mat-divider>\r\n<div>\r\n    <ng-container *ngFor=\"let noteID of noteIDs; let i = index\">\r\n        <!-- <mat-divider></mat-divider> -->\r\n        <div class=\"row py-2\">\r\n            <div class=\"col-xs-6 col-sm-6 col-md-3 text-center\" style=\"padding-top:16px;\">\r\n                <mat-checkbox color=\"primary\" [formControl]=\"notePinnedFormControls[i]\">\r\n                    Pin\r\n                </mat-checkbox>\r\n            </div>\r\n            <div class=\"d-md-none col-xs-6 col-sm-6 text-center\" style=\"padding-top:12px;\">\r\n                <button mat-button color=\"warn\"\r\n                    (click)=\"btnDeleteNote(i)\">\r\n                    <mat-icon>delete</mat-icon>\r\n                    <span>Delete Note</span>\r\n                </button>\r\n            </div>\r\n            <div class=\"col-sm-12 col-md-6\">\r\n                <mat-form-field>\r\n                    <mat-label>Date</mat-label>\r\n                    <input matInput [matDatepicker]=\"datePicker\" [formControl]=\"noteDateFormControls[i]\">\r\n                    <mat-datepicker-toggle matSuffix [for]=\"datePicker\"></mat-datepicker-toggle>\r\n                    <mat-datepicker #datePicker></mat-datepicker>\r\n                    <mat-error *ngIf=\"noteDateFormControls[i].hasError('required')\">\r\n                        Required\r\n                    </mat-error>\r\n                </mat-form-field>\r\n            </div>\r\n            <div class=\"d-none d-md-block col-3 text-center\" style=\"padding-top:12px;\">\r\n                <button mat-button color=\"warn\"\r\n                    (click)=\"btnDeleteNote(i)\">\r\n                    <mat-icon>delete</mat-icon>\r\n                    <span>Delete Note</span>\r\n                </button>\r\n            </div>\r\n            <div class=\"col-12\">\r\n                <mat-form-field>\r\n                    <mat-label>Note</mat-label>\r\n                    <textarea matInput [formControl]=\"notesFormControls[i]\" placeholder=\"Enter Note . . .\"></textarea>\r\n                    <mat-error *ngIf=\"notesFormControls[i].hasError('required')\">\r\n                        Required\r\n                    </mat-error>\r\n                </mat-form-field>\r\n            </div>\r\n        </div>\r\n        <mat-divider></mat-divider>\r\n    </ng-container>\r\n    <button mat-button color=\"primary\" style=\"float:right;\"\r\n        (click)=\"btnAddNote()\">\r\n        <mat-icon>add</mat-icon> Note\r\n    </button>\r\n    <mat-divider></mat-divider>\r\n    <br />\r\n</div>\r\n"
