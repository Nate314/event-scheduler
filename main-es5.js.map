export default "<app-login *ngIf=\"isOnLogin()\"></app-login>\r\n<!-- <ng-container *ngIf=\"isOnLogin()\">\r\n    <ng-container *ngTemplateOutlet=\"routeroutlet\"></ng-container>\r\n</ng-container> -->\r\n<mat-drawer-container *ngIf=\"!isOnLogin()\" class=\"example-container\" autosize>\r\n    <mat-toolbar color=\"primary\">\r\n        <div style=\"cursor:pointer;\" [routerLink]=\"['/home']\">\r\n            <img src=\"https://nathangawith.com/favicon.ico\" height=\"25px\">\r\n            <span>&nbsp;&nbsp;Event Scheduler</span>\r\n        </div>\r\n        <span class=\"example-spacer\"></span>\r\n        <div class=\"d-md-none\">\r\n            <button mat-icon-button [matMenuTriggerFor]=\"menu\" aria-label=\"Example icon-button with a menu\">\r\n                <mat-icon>more_vert</mat-icon>\r\n            </button>\r\n            <mat-menu #menu=\"matMenu\">\r\n                <ng-container *ngTemplateOutlet=\"headerbuttons\"></ng-container>\r\n            </mat-menu>\r\n        </div>\r\n        <div class=\"d-none d-md-block\">\r\n            <ng-container *ngTemplateOutlet=\"headerbuttons\"></ng-container>\r\n        </div>\r\n        <ng-template #headerbuttons>\r\n            <button *ngFor=\"let link of toolbarLinks\" class=\"mr-5\"\r\n                mat-icon-button\r\n                [attr.aria-label]=\"link.label\" (click)=\"link.func()\">\r\n                <span>{{link.label}}&nbsp;</span>\r\n                <mat-icon>{{link.icon}}</mat-icon>\r\n            </button>\r\n        </ng-template>\r\n    </mat-toolbar>\r\n    <ng-container *ngTemplateOutlet=\"routeroutlet\"></ng-container>\r\n</mat-drawer-container>\r\n<ng-template #routeroutlet>\r\n    <br />\r\n    <div class=\"container\">\r\n        <router-outlet></router-outlet>\r\n    </div>\r\n    <br />\r\n</ng-template>\r\n"
