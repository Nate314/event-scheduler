export default "<app-login *ngIf=\"isOnLogin()\"></app-login>\r\n<mat-drawer-container *ngIf=\"!isOnLogin()\" class=\"example-container\" autosize>\r\n    <!--\r\n    <mat-drawer #drawer class=\"example-sidenav\" mode=\"side\">\r\n        <mat-list>\r\n            <ng-container *ngFor=\"let link of sidenavLinks\">\r\n                <mat-list-item matRipple (click)=\"btnSidenav(link)\">\r\n                    {{link.label}}\r\n                </mat-list-item>\r\n                <mat-divider></mat-divider>\r\n            </ng-container>\r\n          </mat-list>\r\n    </mat-drawer>\r\n    -->\r\n\r\n    <mat-toolbar color=\"primary\">\r\n        <!--\r\n        <button mat-icon-button class=\"example-icon\" aria-label=\"Example icon-button with menu icon\"\r\n            (click)=\"drawer.toggle()\">\r\n            <mat-icon>menu</mat-icon>\r\n        </button>\r\n        -->\r\n        <img src=\"https://nathangawith.com/favicon.ico\" height=\"25px\">\r\n        <span>&nbsp;&nbsp;Event Scheduler</span>\r\n        <span class=\"example-spacer\"></span>\r\n        <button *ngFor=\"let link of toolbarLinks\" mat-icon-button class=\"mr-5\"\r\n            [attr.aria-label]=\"link.label\" (click)=\"link.func()\">\r\n            <span>{{link.label}}&nbsp;</span>\r\n            <mat-icon>{{link.icon}}</mat-icon>\r\n        </button>\r\n    </mat-toolbar>\r\n    <br />\r\n    <div class=\"container\">\r\n        <router-outlet></router-outlet>\r\n    </div>\r\n    <br />\r\n</mat-drawer-container>\r\n"
