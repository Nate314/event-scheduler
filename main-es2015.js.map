export default "<div class=\"row\">\r\n    <div class=\"col-xs-12 col-sm-12 col-md-12 col-lg-4 col-xl-4\">\r\n        <app-about></app-about>\r\n    </div>\r\n    <div class=\"col-xs-12 col-sm-12 col-md-12 col-lg-8 col-xl-8\">\r\n        <br />\r\n        <br />\r\n        <h2 class=\"text-center\">{{ greeting }}, {{ username }}</h2>\r\n        <br/>\r\n        <app-event-create></app-event-create>\r\n        <br/>\r\n        <mat-tab-group mat-stretch-tabs selectedIndex=\"1\">\r\n            <mat-tab label=\"Past\">\r\n                <ng-container *ngTemplateOutlet=\"listTemplate;context:pastEvents\"></ng-container>\r\n            </mat-tab>\r\n            <mat-tab label=\"Today\">\r\n                <ng-container *ngTemplateOutlet=\"listTemplate;context:todayEvents\"></ng-container>\r\n            </mat-tab>\r\n            <mat-tab label=\"Future\">\r\n                <ng-container *ngTemplateOutlet=\"listTemplate;context:futureEvents\"></ng-container>\r\n            </mat-tab>\r\n        </mat-tab-group>\r\n        <br/>\r\n        \r\n        <ng-template #listTemplate let-events=\"events\">\r\n            <div class=\"mx-3\">\r\n                <br />\r\n                <div *ngIf=\"!events || events.length === 0\">\r\n                    There are no events in the queue\r\n                </div>\r\n                <div *ngIf=\"events && events.length !== 0\">\r\n                    <ng-container *ngFor=\"let eventID of events\">\r\n                        <app-event-view\r\n                            [eventID]=\"eventID\">\r\n                        </app-event-view>\r\n                        <br />\r\n                    </ng-container>\r\n                </div>\r\n            </div>\r\n        </ng-template>\r\n    </div>\r\n</div>\r\n"
